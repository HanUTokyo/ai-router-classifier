[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-router-classifier"
version = "1.0.0"
description = "Rule and small-model classifier with a thin Ollama gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "prometheus-client>=0.22,<1",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
]

[project.scripts]
ai-router = "router.cli:main"

[tool.setuptools.packages.find]
include = ["router*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
