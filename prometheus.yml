# Prometheus 配置文件
# 监控 LLM 调用指标

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'llm-monitoring'

# 警告规则（可选）
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # ========================================
  # 🟢 MLX OpenAI Agent (端口 8000)
  # ========================================
  - job_name: 'mlx-openai-agent'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:8000']
    scrape_interval: 5s

  # ========================================
  # 🟢 Local Agent / Gateway (端口 8001)
  # ========================================
  - job_name: 'local-agent'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:8001']
    scrape_interval: 5s

  # ========================================
  # 🟢 Router Classifier (端口 8080)
  # ========================================
  - job_name: 'router-classifier'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:8080']
    scrape_interval: 5s

  # ========================================
  # 📊 Prometheus 自身指标
  # ========================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
