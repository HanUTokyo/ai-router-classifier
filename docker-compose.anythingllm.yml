services:
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: anythingllm-router
    ports:
      - "3002:3001"
    cap_add:
      - SYS_ADMIN
    environment:
      - STORAGE_DIR=/app/server/storage
      - SERVER_PORT=3001
      - DISABLE_TELEMETRY=true
    volumes:
      - anythingllm_storage:/app/server/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - anythingllm-router
    restart: unless-stopped

networks:
  anythingllm-router:
    driver: bridge

volumes:
  anythingllm_storage:
