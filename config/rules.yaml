version: 1.15.0
rules:
- id: code-explicit-cn
  label: code
  kind: hard
  pattern_type: regex
  pattern: (写|编写|生成|修改|重构|调试|修复|实现).{0,16}(代码|程序|脚本|函数|接口|SQL|API)
  exclusions:
  - (写出|修改).{0,24}(大写|小写|大小写|标题|单词|词语|文字)
  - 不要改任何程序
  - (拼写|错别字).{0,48}(不要|无需|不必|不涉及).{0,12}(写|编写|生成|修改|改).{0,8}(程序|代码)
  - (不|不要|无需|不必).{0,6}(写|编写|生成).{0,8}(SQL|API|代码|程序|脚本|函数|接口)
  - (大写|小写|大小写|拼写|错别字).{0,48}(不要|无需|不必|不需要).{0,12}(修改|改|编写|写).{0,8}(程序|代码)
  weight: 1.0
  enabled: true
- id: code-error-cn
  label: code
  kind: hard
  pattern_type: regex
  pattern: (代码|程序|脚本|函数|接口|Python|Java|SQL|API).{0,16}(报错|错误|异常|bug|失败)
  exclusions: []
  weight: 1.0
  enabled: true
- id: code-artifact-action-cn
  label: code
  kind: hard
  pattern_type: regex
  pattern: (代码|程序|脚本|函数|接口|Python|Java|SQL|API).{0,20}(怎么改|如何修|修复|调试|重构|优化)
  exclusions: []
  weight: 1.0
  enabled: true
- id: code-explicit-en
  label: code
  kind: hard
  pattern_type: regex
  pattern: (?i)\b(write|implement|debug|fix|refactor|generate)\b.{0,48}\b(code|function|script|api|sql|query|program)\b
  exclusions:
  - (?i)\b(fix|write|modify|change)\b.{0,48}\b(capitali[sz]ation|spelling|word|term|title|lowercase|uppercase|backwards)\b
  - (?i)\bdo not (create|write|modify|change)\b
  weight: 1.0
  enabled: true
- id: code-artifact-action-en
  label: code
  kind: hard
  pattern_type: regex
  pattern: (?i)\b(code|function|script|api|sql(?:\s+query)?|program)\b.{0,48}\b(fix|debug|modify|refactor|implement|optimize)\b
  exclusions: []
  weight: 1.0
  enabled: true
- id: code-sql-statement
  label: code
  kind: hard
  pattern_type: regex
  pattern: (?i)^\s*(select|insert|update|delete|with)\b.{3,}
  exclusions: []
  weight: 1.0
  enabled: true
- id: reason-explicit-cn
  label: reason
  kind: hard
  pattern_type: regex
  pattern: (为什么|请证明|证明一下|分析.{0,8}原因|逻辑推理|推理过程)
  exclusions:
  - (修复|修改|重构|调试|实现|编写|写代码|改代码)
  - (?i)\b(patch|fix|debug|rewrite|refactor|modify|implement|change)\b
  - ((请|用|只要).{0,8}(一句话|简短).{0,8}(回答|说明|解释)|简短回答即可)
  weight: 1.0
  enabled: true
- id: reason-explicit-en
  label: reason
  kind: hard
  pattern_type: regex
  pattern: (?i)\b(why|prove|reason through|analy[sz]e the (cause|reason))\b
  exclusions:
  - (?i)\b(patch|fix|debug|rewrite|refactor|modify|implement|change)\b
  weight: 1.0
  enabled: true
- id: chat-greeting-cn
  label: chat
  kind: hard
  pattern_type: regex
  pattern: ^\s*(你好|您好|嗨|早上好|下午好|晚上好)[！!。.]*\s*$
  exclusions: []
  weight: 1.0
  enabled: true
- id: chat-greeting-en
  label: chat
  kind: hard
  pattern_type: regex
  pattern: (?i)^\s*(hi|hello|hey|good (morning|afternoon|evening))[!. ]*\s*$
  exclusions: []
  weight: 1.0
  enabled: true
- id: chat-joke-cn
  label: chat
  kind: hard
  pattern_type: regex
  pattern: ^\s*(讲|说).{0,4}(笑话|故事)[吧。！!]*\s*$
  exclusions: []
  weight: 1.0
  enabled: true
- id: weak-code-tech-en
  label: code
  kind: weak
  pattern_type: token
  pattern: python|java|sql|api|fastapi|docker|javascript|typescript|rust|golang
  exclusions:
  - (?i)\bpython\b.{0,12}(?:\bsnake\b|这种蛇)
  - (?i)\bjava\b.{0,12}(?:\bisland\b|岛)
  - (?i)\bapi\b.{0,24}(?:\bstand for\b|\babbreviation\b|缩写|含义|意思)
  - (?i)\b(?:python|java|sql|api|javascript|typescript|rust|golang)\b.{0,40}(?:stand
    for|full (?:name|form)|abbreviation|完整英文名称|英文全称|全称|缩写|含义|意思)
  - (?i)(?:spelling|capitalization|lowercase|uppercase|拼写|错别字|大写|小写|大小写|标题|文字).{0,48}\b(?:python|java|sql|api|javascript|typescript|rust|golang)\b
  - (?i)\b(?:python|java|sql|api|javascript|typescript|rust|golang)\b.{0,48}(?:spelling|capitalization|lowercase|uppercase|拼写|错别字|大写|小写|大小写|标题|文字)
  weight: 0.7
  enabled: true
- id: weak-code-cn
  label: code
  kind: weak
  pattern_type: regex
  pattern: (代码|编程|报错|数据库|函数|接口|开发环境|单元测试)
  exclusions: []
  weight: 0.8
  enabled: true
- id: weak-code-action
  label: code
  kind: weak
  pattern_type: regex
  pattern: (调试|重构|部署|编译|执行|查询语句|技术实现)
  exclusions: []
  weight: 0.8
  enabled: true
- id: weak-reason-cn
  label: reason
  kind: weak
  pattern_type: regex
  pattern: (原因|逻辑|推理|证明|分析|比较利弊|如何判断)
  exclusions:
  - ^(请|帮我|请帮我)?\s*(优化|修复|修改|重构|调试|实现|编写)
  - (并|然后|再|接着|同时).{0,8}(修复|修改|重构|调试|实现|编写|优化|增加|加入)
  - (?i)\b(patch|fix|debug|rewrite|refactor|implement|modify)\b
  weight: 0.8
  enabled: true
- id: weak-reason-en
  label: reason
  kind: weak
  pattern_type: token
  pattern: why|reason|prove|analyze|analyse|logic|deduce|compare
  exclusions:
  - (?i)\b(patch|fix|debug|rewrite|refactor|implement|modify)\b
  - (?i)\badd\b.{0,32}\b(retry|backoff|middleware|endpoint|function|handler|api|client|test|code)\b
  weight: 0.8
  enabled: true
- id: weak-chat-cn
  label: chat
  kind: weak
  pattern_type: regex
  pattern: (你好|聊天|笑话|天气|推荐|介绍一下|谢谢|再见)
  exclusions: []
  weight: 0.6
  enabled: true
- id: weak-chat-en
  label: chat
  kind: weak
  pattern_type: regex
  pattern: (?i)(\b(hello|hi|joke|weather|recommend|thanks|bye)\b|\blet'?s\s+chat\b|\bchat\s+(about|with)\b|和我\s*chat)
  exclusions: []
  weight: 0.6
  enabled: true
- id: weak-code-followup-action
  label: code
  kind: weak
  pattern_type: regex
  pattern: (?i)((然后|再|接着|并且|同时).{0,20}(修复|修改|重写|重构|调试|实现|编写|优化|增加|加入|patch|fix|debug|rewrite|refactor|implement|modify|add)|\b(then|and\s+then)\b.{0,64}\b(patch|fix|debug|rewrite|refactor|implement|modify|add)\b)
  exclusions: []
  weight: 0.8
  enabled: true
- id: weak-code-action-en
  label: code
  kind: weak
  pattern_type: regex
  pattern: (?i)\b(debug|refactor)\b
  exclusions: []
  weight: 0.8
  enabled: true
- id: code-explicit-maintenance-en
  label: code
  kind: hard
  pattern_type: regex
  pattern: (?i)\b(debug|refactor|patch|rewrite)\b.{0,64}\b(code|function|script|api|sql|query|program|worker|handler|client|resolver|build|lock|helper|loop|logic|implementation|path|order)\b
  exclusions:
  - (?i)\b(spelling|capitalization|uppercase|lowercase|word|title|sentence|paragraph|plain
    text)\b
  - (?i)\bdo not (edit|change|modify|write|create)\b.{0,24}\b(software|code|program|query)\b
  weight: 1.0
  enabled: true
